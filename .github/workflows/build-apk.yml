
name: Build My Car Manager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip My_Car_Manager_Android_Starter.zip -d android-project

      - name: Build APK
        working-directory: android-project
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: My-Car-Manager-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
